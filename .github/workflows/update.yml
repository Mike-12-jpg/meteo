name: Aggiorna calendario meteo
on:
  schedule:
    - cron: "*/30 * * * *"   # ogni 30 minuti
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python meteo_ics.py
      - name: Commit se cambiato
        run: |
          git config user.name "meteo-bot"
          git config user.email "meteo-bot@users.noreply.github.com"
          git add docs/meteo.ics
          git diff --cached --quiet || (git commit -m "Aggiorna meteo" && git push)
